name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet publish src/HmaMcp -c Release -o out

      # No ROMs in CI (they can't be distributed): this checks the server starts,
      # completes the MCP handshake, lists its tools and reports errors cleanly.
      - name: MCP handshake
        shell: bash
        run: |
          exe=out/hma-mcp
          [ -f out/hma-mcp.exe ] && exe=out/hma-mcp.exe
          python3 tests/smoke.py "$exe"
